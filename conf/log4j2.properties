status = warn
name = HudiRadixLogConfig

appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5level %c - %msg%n

rootLogger.level = warn
rootLogger.appenderRefs = console
rootLogger.appenderRef.console.ref = Console

logger.radix.name = org.apache.hudi.index.radix
logger.radix.level = info
logger.radix.additivity = false
logger.radix.appenderRefs = console
logger.radix.appenderRef.console.ref = Console